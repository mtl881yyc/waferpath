name: Publish static website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      - name: Generate website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 src/build.py
      - name: Include Google Search Console ownership verification
        run: cp googlebf05928d73e4a147.html dist/client/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
